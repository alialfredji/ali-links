name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Configure deployment URL
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          CONFIGURED_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if [ -n "$CONFIGURED_SITE_URL" ]; then
            echo "SITE_URL=$CONFIGURED_SITE_URL" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          fi

          if [ -n "$CONFIGURED_BASE_PATH" ]; then
            echo "BASE_PATH=$CONFIGURED_BASE_PATH" >> "$GITHUB_ENV"
          elif [ "$REPOSITORY_NAME" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPOSITORY_NAME/" >> "$GITHUB_ENV"
          fi
      - run: pnpm validate
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
